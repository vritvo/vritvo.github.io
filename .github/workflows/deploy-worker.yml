# Deploys the standalone contact-form Cloudflare Worker.
# Separate from astro.yml (which deploys the static site to GitHub Pages).
# Only runs when the Worker's files actually change.
name: Deploy contact Worker

on:
  push:
    branches: ["main"]
    paths:
      - "src/server/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
